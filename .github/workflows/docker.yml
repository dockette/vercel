name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Build image"
        uses: docker/build-push-action@v7
        with:
          context: "."
          load: true
          tags: "dockette/vercel:latest"

      - name: "Test image"
        run: "make test"

  build:
    name: "Build"
    needs: ["test"]
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/vercel"
      tag: "latest"

  docs:
    name: "Docs"
    needs: ["build"]
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/vercel"
